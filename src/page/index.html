<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asheron's Call Bestiary: the Tusker family</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>The Tusker family</h1>
      <p class="credit">
        Stats from the AC Emulator world database. Names and trophies from
        <a href="https://acpedia.org/wiki/Tusker" rel="noreferrer">ACPedia</a>.
        Models and icons from the retail client data.
        <a href="https://github.com/Raajik/ac-bestiary" rel="noreferrer">Source code</a> (AGPL-3.0, uses
        <a href="https://github.com/jakemmarsh/webac" rel="noreferrer">webAC</a>).
      </p>
    </header>

    <form class="filters" id="filters">
      <label>
        <span>Name</span>
        <input type="search" id="search" placeholder="Search" autocomplete="off" />
      </label>
      <label>
        <span>Level</span>
        <input type="number" id="level-min" placeholder="min" min="0" />
        <input type="number" id="level-max" placeholder="max" min="0" />
      </label>
      <label class="check">
        <input type="checkbox" id="trophy-only" />
        <span>Drops a trophy</span>
      </label>
      <label>
        <span>Sort</span>
        <select id="sort">
          <option value="level">Level</option>
          <option value="name">Name</option>
          <option value="health">Health</option>
        </select>
      </label>
      <span class="count" id="count"></span>
    </form>

    <main class="grid" id="grid"></main>

    <div class="detail" id="detail" hidden>
      <div class="detail-inner">
        <button class="close" id="close" type="button" aria-label="Close">×</button>
        <div class="viewer">
          <canvas id="model-canvas"></canvas>
          <div class="motions" id="motions"></div>
          <p class="hint" id="viewer-hint">Drag to turn the model.</p>
        </div>
        <div class="panel" id="panel"></div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
